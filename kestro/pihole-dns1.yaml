apiVersion: v1
kind: Namespace
metadata:
  name: pihole
---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: pihole
  name: pi-hole-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.200.62
    path: /home-automation/pi-hole
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pihole-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: pihole
  name: pi-hole-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  volumeName: pi-hole-pv
  storageClassName: pihole-storage
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: media-vlan
  namespace: pihole
spec:
  config: '{
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth0.100",
          "mode": "bridge",
          "ipam": {
            "type": "dhcp"
          }
        }, {
          "capabilities": { "mac": true },
          "type": "tuning"
        }
      ]
    }'
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: admin-vlan
  namespace: pihole
spec:
  config: '{
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth0",
          "mode": "bridge",
          "ipam": {
            "type": "dhcp"
          }
        }, {
          "capabilities": { "mac": true },
          "type": "tuning"
        }
      ]
    }'
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihile-web
  namespace: pihole
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pihole.kestro.home`)
      kind: Rule
      services:
        - name: kestro-dns1-pihole-web
          port: 80