---
apiVersion: v1
kind: Namespace
metadata:
  name: kestro-nodered
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node-red-data
  namespace: kestro-nodered
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: kestro-nas
---
kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    deployment.kubernetes.io/revision: "2"
  labels:
    app: node-red
  generation: 1
  name: node-red
  namespace: kestro-nodered
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: node-red
          image: nodered/node-red:5
          ports:
            - name: http
              protocol: TCP
              containerPort: 1880
          volumeMounts:
            - name: node-red-data
              mountPath: /data
      volumes:
        - name: node-red-data
          persistentVolumeClaim:
            claimName: node-red-data
---
kind: Service
apiVersion: v1
metadata:
  name: node-red
  labels:
    app: node-red
  namespace: kestro-nodered
spec:
  selector:
    app: node-red
  ports:
    - name: http
      protocol: TCP
      port: 1880
      targetPort: 1880
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: node-red-ui
  namespace: kestro-nodered
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`node-red.kestro.home`)
      kind: Rule
      services:
        - name: node-red
          port: 1880
  tls:
    secretName: tls-node-red
---