---
kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    deployment.kubernetes.io/revision: "2"
  labels:
    app: home-assistant
  generation: 1
  name: home-assistant
  namespace: kestro-media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: home-assistant
      annotations:
        kubernetes.io/change-cause: "update to home-assistant 2025.1"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: home-assistant
          image: "homeassistant/home-assistant:2025.1"
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: home-assistant-config
              mountPath: /config
            - name: home-assistant-media
              mountPath: /media
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: "200m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 8123
            initialDelaySeconds: 180
            periodSeconds: 30
      volumes:
        - name: home-assistant-config
          nfs:
            server: nas
            path: /home-automation/home-assistant/config
        - name: home-assistant-media
          nfs:
            server: nas
            path: /music
---
kind: Service
apiVersion: v1
metadata:
  name: home-assistant
  namespace: kestro-media
spec:
  selector:
    app: home-assistant
  ports:
    - name: http
      protocol: TCP
      port: 8123
      targetPort: 8123
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant-ui
  namespace: kestro-media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home-assistant.kestro.home`)
      kind: Rule
      services:
        - name: home-assistant
          port: 8123
  tls:
    secretName: tls-home-assistant
---

